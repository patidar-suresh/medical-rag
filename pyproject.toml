[project]
name = "medrag"
version = "0.1.0"
description = "Production-grade medical RAG over a textbook corpus, fully local (Ollama + Qdrant)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "pydantic-settings",
    "qdrant-client",
    "sentence-transformers",
    "typer",
    "structlog",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "pre-commit"]

[project.scripts]
medrag = "medrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
