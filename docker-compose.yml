# Local infrastructure. Ollama runs on the host (Windows side), not in Compose.
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2   # keep the minor version in step with qdrant-client
    container_name: medrag-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"   # REST + dashboard at http://localhost:6333/dashboard
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
